; ============================================================
;  SIMON SAYS  -  ESP8266 + PCF8574 + SSD1306 + WS2812B
;
;  Build / upload the game :  pio run -e simon_says -t upload
;  Run a hardware test     :  pio run -e test_buttons -t upload
;  Open the serial monitor :  pio device monitor
; ============================================================

[platformio]
default_envs = simon_says

; ---------- shared by every environment ----------
[env]
platform      = espressif8266
board         = nodemcuv2          ; use  d1_mini  for a Wemos D1 mini (same D1/D2/D4/D5 pins)
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit NeoPixel@^1.12.0

; ---------- the game (src/main.cpp) ----------
[env:simon_says]
build_src_filter = +<*>

; ---------- hardware tests (hardware_tests/*) ----------
[env:test_buttons]
build_src_filter = -<*> +<../hardware_tests/test_buttons/>

[env:test_rgb]
build_src_filter = -<*> +<../hardware_tests/test_rgb/>

[env:test_oled]
build_src_filter = -<*> +<../hardware_tests/test_oled/>
